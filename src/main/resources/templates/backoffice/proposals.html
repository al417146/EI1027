<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Propuesta de candidatos</title>
  <link rel="stylesheet" type="text/css" href="/static/css/style.css" th:ref="@{css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo"><img src="/static/images/logo-ovi.png" alt="Logo OVI" class="logo-img"></div>
  <div class="nav-bar">
    <a th:href="@{/admin/list}" class="nav-link">Volver a solicitudes</a>
    <a th:href="@{/logout}" class="nav-link">Cerrar sesión</a>
  </div>
</header>
<div class="container">
  <div class="header-primary">
    <h1>Propuesta para la solicitud #<span th:text="${request.idRequest}"></span></h1>
    <p>Usuario: <span th:text="${user.name}"></span> (DNI: <span th:text="${user.DNI}"></span>)</p>
  </div>
  <div style="padding:20px">
    <div th:if="${#lists.isEmpty(candidates)}" class="alert-info">
      No hay candidatos disponibles para esta solicitud.
    </div>
    <div th:unless="${#lists.isEmpty(candidates)}">
      <h2>Candidatos encontrados</h2>
      <div class="lista-candidatos">
        <div th:each="cand : ${candidates}" class="tarjeta-candidato">
          <h3 th:text="${cand.name}"></h3>
          <p><strong>DNI:</strong> <span th:text="${cand.DNI}"></span></p>
          <p><strong>Dirección:</strong> <span th:text="${cand.address}"></span></p>
          <p><strong>Especialidades:</strong></p>
          <ul th:unless="${#maps.isEmpty(cand.specialties)}">
            <li th:each="spec : ${cand.specialties}" th:text="${spec.value}"></li>
          </ul>
          <span th:if="${#maps.isEmpty(cand.specialties)}">Sin especialidades</span>
          <form th:action="@{/admin/approve}" method="post" style="margin-top:10px">
            <input type="hidden" name="idRequest" th:value="${request.idRequest}">
            <input type="hidden" name="DNICand" th:value="${cand.DNI}">
            <button type="submit" class="btn btn-success">Asignar este profesional</button>
          </form>
        </div>
      </div>
    </div>
    <div style="margin-top:20px">
      <a th:href="@{/admin/list}" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>
</body>
</html>
