<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis actividades</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/PAP/index}" class="nav-link">Inicio</a>
    <a th:href="@{/activity/list}" class="nav-link">Actividades</a>
    <a th:href="@{/PAP/misActividades}" class="nav-link">Mis actividades</a>
    <a th:href="@{/PAP/solicitudesPendientes}" class="nav-link">Solicitudes</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Mis actividades</h1>
  </div>
  <div style="padding:20px">
    <div th:if="${#lists.isEmpty(inscripciones)}" class="alert-info">
      No estás inscrito en ninguna actividad.
    </div>
    <table th:unless="${#lists.isEmpty(inscripciones)}" class="data-table">
      <thead>
        <tr>
          <th>Actividad</th>
          <th>¿Asistido?</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${inscripciones}">
          <td th:text="${r.name}"></td>
          <td>
            <span th:if="${r.attended}" class="estado-aprobada">Sí</span>
            <span th:unless="${r.attended}" class="estado-pendiente">Pendiente</span>
          </td>
        </tr>
      </tbody>
    </table>
    <div style="margin-top:20px">
      <a th:href="@{/PAP/index}" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</main>
</body>
</html>
