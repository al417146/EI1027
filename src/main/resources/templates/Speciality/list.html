<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Gestionar Especialidades</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" type="text/css" href="/css/style.css" th:href="@{css/style.css}">
</head>
<body>
<header class="top-bar">
    <div class="logo"><img src="/images/logo-ovi.png" alt="Logo OVI" class="logo-img"></div>
    <div class="nav-bar">
        <a href="/" class="nav-link">Inicio</a>
        <a href="/speciality/list" class="nav-link">Especialidades</a>
        <a href="/iniciarSesion" class="nav-link">Iniciar sesión</a>
    </div>
</header>
<div class="container">
    <div class="header-secondary">
        <h1>Lista de Especialidades</h1>
    </div>
    <div style="padding:20px">
        <div th:if="${#lists.isEmpty(specialities)}" class="alert-info">
            No hay especialidades registradas.
        </div>
        <div th:unless="${#lists.isEmpty(specialities)}">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="speciality : ${specialities}">
                        <td th:text="${speciality.idSpeciality}"></td>
                        <td th:text="${speciality.descrip}"></td>
                        <td>
                            <a th:href="@{/speciality/edit/{id}(id=${speciality.idSpeciality})}" class="btn btn-outline btn-sm">Editar</a>
                            <a th:href="@{/speciality/delete/{id}(id=${speciality.idSpeciality})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta especialidad?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div style="margin-top:20px">
            <a href="/speciality/add" class="btn btn-primary">Añadir especialidad</a>
            <a href="/" class="btn btn-secondary">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
