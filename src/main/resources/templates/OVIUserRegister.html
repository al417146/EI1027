<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro OVIUser</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="top-bar">
    <div class="logo">
        <img src="/images/logo-ovi.png" class="logo-img">
    </div>
</header>

<div class="container">

    <div class="header-primary">
        <h1>Registro OVIUser</h1>
        <p>Introduce tus datos personales</p>
    </div>

    <div class="card" style="max-width:600px; margin:30px auto;">

        <form th:action="@{/register/oviuser}" th:object="${oviuser}" method="post">

            <div class="form-group">
                <label>DNI</label>
                <input type="text" th:field="*{DNI}" required>
            </div>

            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" th:field="*{name}" required>
            </div>

            <div class="form-group">
                <label>Fecha de nacimiento</label>
                <input type="date" th:field="*{birthDate}" required>
            </div>

            <div class="form-group">
                <label>Género</label>
                <input type="text" th:field="*{gender}" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" th:field="*{phone}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" th:field="*{mail}" required>
            </div>

            <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{address}" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Registrarse</button>

        </form>

    </div>

</div>

</body>
</html>
