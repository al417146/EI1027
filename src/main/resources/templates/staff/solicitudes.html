<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solicitudes pendientes</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/staff/index}" class="nav-link">Inicio</a>
    <a th:href="@{/staff/oviusers}" class="nav-link">Usuarios OVI</a>
    <a th:href="@{/staff/solicitudes}" class="nav-link">Solicitudes</a>
    <a th:href="@{/staff/patis}" class="nav-link">PAP/PATIS</a>
    <a th:href="@{/staff/formadores/list}" class="nav-link">Formadores</a>
    <a th:href="@{/speciality/list}" class="nav-link">Especialidades</a>
    <a th:href="@{/staff/stats}" class="nav-link">Estadísticas</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Solicitudes pendientes</h1>
  </div>
  <div style="padding:20px">
    <div style="margin-bottom:15px;">
      <a th:href="@{/staff/solicitudes(tipus='pendents')}" class="btn btn-primary" th:classappend="${tipus == 'pendents'} ? ' btn-active' : ''">Pendientes</a>
      <a th:href="@{/staff/solicitudes(tipus='rebutjades')}" class="btn btn-secondary" th:classappend="${tipus == 'rebutjades'} ? ' btn-active' : ''">Denegadas</a>
    </div>
    <div th:if="${#lists.isEmpty(solicitudes)}" class="alert-info">
      No hay solicitudes pendientes.
    </div>
    <div th:unless="${#lists.isEmpty(solicitudes)}">
      <table class="data-table">
        <thead>
        <tr>
          <th>DNI</th>
          <th>Nombre</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${solicitudes}" th:id="'row-' + ${s['idrequest']}">
          <td th:text="${s.dniuser}"></td>
          <td th:text="${s.username}"></td>
          <td th:text="${#dates.format(s.date, 'dd/MM/yyyy')}"></td>
          <td>
            <span th:if="${s.status == 'Pendiente'}" class="estado-pendiente" th:text="${s.status}"></span>
            <span th:if="${s.status == 'Propuesta enviada'}" class="estado-pendiente" th:text="${s.status}"></span>
            <span th:if="${s.status == 'Aceptada'}" class="estado-aprobada" th:text="${s.status}"></span>
            <span th:if="${s.status == 'Denegada'}" class="estado-rechazada" th:text="${s.status}"></span>
          </td>
          <td>
            <a th:if="${tipus == 'pendents'}" th:href="@{/staff/match/{id}(id=${s['idrequest']})}" class="btn btn-outline">Generar propuesta</a>
            <a th:if="${tipus == 'pendents'}" th:href="@{/staff/solicitudes/denegar/{id}(id=${s['idrequest']})}" class="btn btn-secondary" onclick="return confirm('¿Seguro que quieres denegar esta solicitud?')">Denegar</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <br>
    <a th:href="@{/staff/index}" class="btn btn-primary">Volver</a>
  </div>
</main>
</body>
</html>
