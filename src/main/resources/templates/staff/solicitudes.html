<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solicitudes pendientes</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/staff/index}" class="nav-link">Inicio</a>
    <a th:href="@{/staff/oviusers}" class="nav-link">Usuarios OVI</a>
    <a th:href="@{/staff/solicitudes}" class="nav-link">Solicitudes</a>
    <a th:href="@{/staff/patis}" class="nav-link">Profesionales</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Solicitudes pendientes</h1>
  </div>
  <div style="padding:20px">
    <div th:if="${#lists.isEmpty(solicitudes)}" class="alert-info">
      No hay solicitudes pendientes.
    </div>
    <table th:unless="${#lists.isEmpty(solicitudes)}" class="data-table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Fecha</th>
        <th>Zona preferida</th>
        <th>Especialidad</th>
        <th>Género preferido</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="s : ${solicitudes}">
        <td th:text="${s.idRequest}"></td>
        <td th:text="${s.DNIUser}"></td>
        <td th:text="${#dates.format(s.date, 'dd/MM/yyyy')}"></td>
        <td th:text="${s.preferredZone}"></td>
        <td th:text="${s.preferredSpeciality}"></td>
        <td th:text="${s.preferredGender}"></td>
        <td><span class="estado-pendiente" th:text="${s.status}"></span></td>
        <td>
          <a th:href="@{/staff/solicitudes/match/{id}(id=${s.idRequest})}"
             class="btn btn-outline">Ver candidatos</a>
          <a th:href="@{/staff/solicitudes/denegar/{id}(id=${s.idRequest})}"
             class="btn btn-secondary">Denegar</a>
        </td>
      </tr>
      </tbody>
    </table>
    <br>
    <a th:href="@{/staff/index}" class="btn btn-primary">Volver</a>
  </div>
</main>
</body>
</html>
