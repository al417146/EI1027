<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Añadir formador</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/staff/index}" class="nav-link">Inicio</a>
    <a th:href="@{/staff/formadores/list}" class="nav-link">Formadores</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Añadir formador</h1>
  </div>
  <div class="card" style="margin:20px; padding:20px">
    <form th:action="@{/staff/formadores/add}" th:object="${professional}" method="post">
      <div class="form-group">
        <label>DNI</label>
        <input type="text" th:field="*{DNI}" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" th:field="*{name}" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" th:field="*{phone}" class="form-control">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{mail}" class="form-control">
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" th:field="*{address}" class="form-control">
      </div>
      <div class="form-group">
        <label>Especialidad</label>
        <input type="text" th:field="*{uniqueSpeciality}" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/staff/formadores/list}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</main>
</body>
</html>
