<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar formador</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/staff/index}" class="nav-link">Inicio</a>
    <a th:href="@{/staff/oviusers}" class="nav-link">Usuarios OVI</a>
    <a th:href="@{/staff/solicitudes}" class="nav-link">Solicitudes</a>
    <a th:href="@{/staff/patis}" class="nav-link">PAP/PATIS</a>
    <a th:href="@{/staff/formadores/list}" class="nav-link">Formadores</a>
    <a th:href="@{/speciality/list}" class="nav-link">Especialidades</a>
    <a th:href="@{/staff/stats}" class="nav-link">Estadísticas</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Editar formador</h1>
  </div>
  <div class="card" style="margin:20px; padding:20px">
    <form th:action="@{/staff/formadores/edit}" th:object="${professional}" method="post">
      <input type="hidden" th:field="*{DNI}">
      <div class="form-group">
        <label for="DNI">DNI</label>
        <input type="text" id="DNI" th:value="*{DNI}" class="form-control" readonly>
        <div th:if="${#fields.hasErrors('DNI')}" th:errors="*{DNI}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" required>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="text" id="phone" th:field="*{phone}" class="form-control">
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="mail">Email</label>
        <input type="email" id="mail" th:field="*{mail}" class="form-control">
        <div th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="address">Dirección</label>
        <input type="text" id="address" th:field="*{address}" class="form-control">
        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error"></div>
      </div>
      <div class="form-group">
        <label>Especialidades</label>
        <div style="max-width:300px;">
          <div th:each="e : ${especialidades}" style="display:flex; align-items:center; justify-content:space-between; margin:5px 0; gap:8px;">
            <label th:text="${e}" style="margin:0; font-weight:normal; cursor:pointer;"></label>
            <input type="checkbox" name="selectedEspecialidades" th:value="${e}"
                   th:checked="${professional.uniqueSpeciality != null and professional.uniqueSpeciality.contains(e)}">
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a th:href="@{/staff/formadores/list}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</main>
</body>
</html>
