<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Información del contrato</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <div class="logo"><img src="/images/logo-ovi.png" alt="Logo OVI" class="logo-img"></div>
  </div>
</header>
<div class="container">
  <div class="header-primary">
    <h1>Información del contrato</h1>
  </div>
  <div class="card" style="margin:20px">
    <div class="detalle-perfil">
      <div class="campo"><label>ID Contrato:</label> <span th:text="${contrato.idContract}"></span></div>
      <div class="campo"><label>Fecha inicio:</label> <span th:text="${#dates.format(contrato.dateStart, 'dd/MM/yyyy')}"></span></div>
      <div class="campo"><label>Fecha fin:</label>
        <span th:if="${contrato.dateEnd != null}" th:text="${#dates.format(contrato.dateEnd, 'dd/MM/yyyy')}"></span>
        <span th:unless="${contrato.dateEnd != null}" class="estado-pendiente">Indefinido</span>
      </div>
      <div class="campo"><label>ID Solicitud:</label> <span th:text="${contrato.idRequest}"></span></div>
      <div class="campo"><label>DNI Candidato:</label> <span th:text="${contrato.DNICand}"></span></div>
    </div>
  </div>
  <div style="margin:20px">
    <a href="/templates/OVIUser/list.html" class="btn btn-primary">Volver</a>
  </div>
</div>
</body>
</html>
