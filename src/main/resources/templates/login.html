<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
    <div class="logo">
        <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
    </div>
</header>
<main class="container">
    <div class="header-primary">
        <h1>Iniciar sesión</h1>
    <div th:if="${param.denegado}" class="alert-info" style="color:red;">Tu solicitud ha sido denegada por el staff de la OVI. Contacta con nosotros para más información.</div>
        <p>Accede a tu cuenta de OVI</p>
    </div>
    <div class="card" style="max-width:500px; margin:30px auto;">
        <form th:action="@{/login}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="dni">Usuario (DNI)</label>
                <input type="text" id="dni" th:field="*{dni}"
                       class="form-control" placeholder="Introduce tu DNI">
                <div th:if="${#fields.hasErrors('dni')}"
                     th:errors="*{dni}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}"
                       class="form-control" placeholder="Introduce tu contraseña">
                <div th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}" class="error"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
        </form>
        <p style="margin-top:20px; text-align:center;">
            ¿No tienes cuenta?
            <a th:href="@{/register}"><strong>Regístrate aquí</strong></a>
        </p>
    </div>
</main>
</body>
</html>
