<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" type="text/css" href="/static/css/style.css" th:ref="@{css/style.css}">
</head>

<body>

<header class="top-bar">
    <div class="logo">
        <img src="/static/images/logo-ovi.png" alt="Logo OVI" class="logo-img">
    </div>
</header>

<div class="container">

    <div class="header-primary">
        <h1>Iniciar sesión</h1>
        <p>Accede a tu cuenta de OVI</p>
    </div>

    <div class="card" style="max-width: 500px; margin: 30px auto;">

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label>Usuario (DNI)</label>
                <input type="text" name="username" placeholder="Introduce tu DNI" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Introduce tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>

        </form>

        <p style="margin-top:20px; text-align:center;">
            ¿No tienes cuenta?
            <a th:href="@{/register}">Regístrate aquí</a>
        </p>

    </div>

</div>

</body>
</html>
