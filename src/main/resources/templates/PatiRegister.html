<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro PATI</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Registro PAP/PATI</h1>
    <p>Introduce tus datos y especialidades</p>
  </div>
  <div class="card" style="max-width:600px; margin:30px auto;">
    <form th:action="@{/register/pati}" th:object="${pati}" method="post">
      <div class="form-group">
        <label for="DNI">DNI</label>
        <input type="text" id="DNI" th:field="*{DNI}" class="form-control" required>
        <div th:if="${#fields.hasErrors('DNI')}" th:errors="*{DNI}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" required>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="birthDate">Fecha de nacimiento</label>
        <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" required>
        <div th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="gender">Género</label>
        <select id="gender" th:field="*{gender}" class="form-control" required>
          <option value="">Selecciona</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="O">Otro</option>
        </select>
        <div th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="text" id="phone" th:field="*{phone}" class="form-control" required>
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="mail">Email</label>
        <input type="email" id="mail" th:field="*{mail}" class="form-control" required>
        <div th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="address">Dirección</label>
        <input type="text" id="address" th:field="*{address}" class="form-control" required>
        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error"></div>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" required>
        <div th:if="${#fields.hasErrors('password')}" th:errors="${passwordError}" class="error"></div>
      </div>
