<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro PATI</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Registro PAP/PATI</h1>
    <p>Introduce tus datos y especialidades</p>
  </div>
  <div class="card" style="max-width:600px; margin:30px auto;">
    <form th:action="@{/register/pati}" th:object="${pati}" method="post">
      <div class="form-group">
        <label>DNI</label>
        <input type="text" th:field="*{DNI}" class="form-control" required>
        <div th:if="${#fields.hasErrors('DNI')}" th:errors="*{DNI}" class="error"></div>
      </div>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" th:field="*{name}" class="form-control" required>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
      </div>
      <div class="form-group">
        <label>Fecha de nacimiento</label>
        <input type="date" th:field="*{birthDate}" class="form-control">
      </div>
      <div class="form-group">
        <label>Género</label>
        <select th:field="*{gender}" class="form-control" required>
          <option value="">Selecciona</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="O">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Teléfono (9 dígitos)</label>
        <input type="text" th:field="*{phone}" class="form-control" required>
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{mail}" class="form-control" required>
        <div th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="error"></div>
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <select th:field="*{address}" class="form-control" required>
          <option value="">Selecciona una zona</option>
          <option value="Barcelona">Barcelona</option>
          <option value="Bremen">Bremen</option>
          <option value="Castellón">Castellón</option>
          <option value="Estrasburgo">Estrasburgo</option>
          <option value="Madrid">Madrid</option>
          <option value="Valencia">Valencia</option>
          <option value="Villarreal">Villarreal</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" th:field="*{password}" class="form-control" required>
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
      </div>
      <div class="form-group">
        <label>Especialidades</label>
        <div th:each="s : ${specialities}" style="margin:5px 0">
          <input type="checkbox" name="selectedSpecialities" th:value="${s.idSpeciality}">
          <span th:text="${s.descrip}"></span>
        </div>
      </div>
      <div class="form-group">
        <input type="checkbox" id="lopd" name="lopd" required>
        <label for="lopd">
          He llegit i accepte la
          <a href="#" onclick="alert('Política de privacitat: Les teves dades seran tractades per la OVI Castelló per gestionar el servei d\'assistència personal, d\'acord amb el RGPD i la LOPD.')">
            política de privacitat
          </a> i el tractament de les meves dades personals (LOPD/RGPD).
        </label>
      </div>
      <button type="submit" class="btn btn-secondary" style="width:100%;">Registrarse</button>
      <a th:href="@{/register}" class="btn btn-outline" style="width:100%; margin-top:10px;">Cancelar</a>
    </form>
  </div>
</main>
</body>
</html>
