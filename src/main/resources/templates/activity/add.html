<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva actividad</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/activity/list}" class="nav-link">Actividades</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Nueva actividad</h1>
  </div>
  <div class="card" style="margin:20px; padding:20px">
    <form th:action="@{/activity/add}" th:object="${activity}" method="post">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" th:field="*{name}" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Lugar</label>
        <input type="text" th:field="*{place}" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" th:field="*{actDate}" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select th:field="*{type}" class="form-select">
          <option value="formacio">Formación (plazas limitadas)</option>
          <option value="divulgacio">Divulgación (sin inscripción)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Plazas máximas (solo formación)</label>
        <input type="number" th:field="*{maxParticipants}" class="form-control" min="1">
      </div>
      <div class="form-group">
        <label>Formador</label>
        <select th:field="*{dniProf}" class="form-select">
          <option value="">Sense assignar</option>
          <option th:each="prof : ${professionals}" th:value="${prof.DNI}" th:text="${prof.name}"></option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Crear actividad</button>
      <a th:href="@{/activity/list}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</main>
</body>
</html>
