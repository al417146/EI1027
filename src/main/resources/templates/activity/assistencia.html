<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar asistencia</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/activity/list}" class="nav-link">Actividades</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<main class="container">
  <div class="header-primary">
    <h1>Asistencia: <span th:text="${activity.name}"></span></h1>
  </div>
  <div style="padding:20px">
    <div th:if="${#lists.isEmpty(inscrits)}" class="alert-info">
      No hay inscritos en esta actividad.
    </div>
    <table th:unless="${#lists.isEmpty(inscrits)}" class="data-table">
      <thead>
        <tr>
          <th>DNI Usuario</th>
          <th>¿Ha asistido?</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${inscrits}">
          <td th:text="${r.dniUser}"></td>
          <td>
            <span th:if="${r.attended}" class="estado-aprobada">Sí</span>
            <span th:unless="${r.attended}" class="estado-rechazada">No</span>
          </td>
          <td>
            <form th:action="@{/activity/assistencia/update}" method="post" style="display:inline">
              <input type="hidden" name="idRegist" th:value="${r.idRegist}">
              <input type="hidden" name="idActivity" th:value="${activity.idActivity}">
              <input type="hidden" name="attended" value="true">
              <button type="submit" class="btn btn-success" th:unless="${r.attended}">Marcar presente</button>
            </form>
            <form th:action="@{/activity/assistencia/update}" method="post" style="display:inline">
              <input type="hidden" name="idRegist" th:value="${r.idRegist}">
              <input type="hidden" name="idActivity" th:value="${activity.idActivity}">
              <input type="hidden" name="attended" value="false">
              <button type="submit" class="btn btn-secondary" th:if="${r.attended}">Desmarcar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <div style="margin-top:20px">
      <a th:href="@{/activity/detail/{id}(id=${activity.idActivity})}" class="btn btn-secondary">Volver</a>
      <a th:href="@{/staff/index}" class="btn btn-outline">Volver al panel</a>
    </div>
  </div>
</main>
</body>
</html>
