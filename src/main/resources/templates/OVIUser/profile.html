<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
    <div class="logo">
        <img th:src="@{/images/logo-ovi.png}"
             alt="Logo OVI"
             class="logo-img" src="/static/images/logo-ovi.png">
    </div></header>
<div class="container">
    <div class="header-primary">
        <h1>Actualizar mis datos</h1>
    </div>
    <div class="card" style="margin:20px">
        <form th:action="@{/OVIUser/profile}" th:object="${oviuser}" method="post">
            <div class="form-group">
                <label for="DNI">DNI (no editable)</label>
                <input type="text" id="DNI" th:field="*{DNI}" readonly="readonly" class="form-control"/>
            </div>
            <div class="form-group">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" th:field="*{name}" class="form-control"/>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="mail">Email</label>
                <input type="email" id="mail" th:field="*{mail}" class="form-control"/>
                <div th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control"/>
                <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="address">Dirección</label>
                <input type="text" id="address" th:field="*{address}" class="form-control"/>
                <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error"></div>
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a th:href="@{/OVIUser/OVIIndex}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
