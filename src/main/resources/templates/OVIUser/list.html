<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis profesionales contratados</title>
  <link rel="stylesheet" type="text/css" href="/static/css/style.css" th:href="@{css/style.css}">
</head>
<body>
<header class="top-bar">
    <div class="logo">
        <img th:src="@{/images/logo-ovi.png}"
             alt="Logo OVI"
             class="logo-img" src="/images/logo-ovi.png">
    </div>
    <nav class="nav-bar">
        <a th:href="@{/OVIUser/index}" class="nav-link">Inicio</a>
        <a th:href="@{/OVIUser/available}" class="nav-link">Solicitar profesional</a>
        <a th:href="@{/OVIUser/estadoSolicitud}" class="nav-link">Mis solicitudes</a>
        <a th:href="@{/OVIUser/list}" class="nav-link">Mis contratos</a>
        <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
    </nav>
</header>
<div class="container">
    <div class="header-primary">
        <h1>Profesionales con contrato activo</h1>
    </div>
    <div style="padding:20px">
        <div th:unless="${#lists.isEmpty(patis)}">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                    <tr><th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Contrato</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="p : ${patis}">
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.phone}"></td>
                        <td th:text="${p.mail}"></td>
                        <td>
                            <a th:href="@{/OVIUser/Contrato/{dni}(dni=${p.DNI})}" class="btn btn-outline">Ver contrato</a>
                        </td>
                        <td>
                            <a th:if="${contractMap != null and contractMap.get(p.DNI) != null and contractMap.get(p.DNI).dateEnd == null}"
                               th:href="@{/OVIUser/contrato/finalizar/{id}(id=${contractMap.get(p.DNI).idContract})}"
                               class="btn btn-warning">Finalizar contrato</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div style="margin-top:20px">
            <a href="/templates/OVIUser/OVIndex.html" class="btn btn-secondary">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
