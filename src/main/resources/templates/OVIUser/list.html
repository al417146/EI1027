<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Oficina para la vida independiente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
</head>
<body>
<main class="container">
    <h1>Lista de PAP/PATIs</h1>

    <!-- Mostramos un error si el OVIUser no tiene PATI -->
    <div th:if="${errorSinPatis != null and !#strings.isEmpty(errorSinPatis)}"
         class="alert alert-warning"
         th:text="${errorSinPatis}">
    </div>

    <!-- Tabla solo si hay PATIs -->
    <div th:unless="${#lists.isEmpty(patis)}">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pati : ${patis}">
                <td th:text="${pati.DNI}"></td>
                <td th:text="${pati.name}"></td>
                <td th:text="${pati.age}"></td>
                <td th:text="${pati.phone}"></td>
                <td th:text="${pati.mail}"></td>
                <td th:text="${pati.address}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje informativo si la lista está vacía (por si no hubo error) -->
    <div th:if="${#lists.isEmpty(patis)} and ${errorSinPatis == null}"
         class="alert alert-info">
        No hay suficientes PATIs en la base de datos.
    </div>
</main>
</body>
</html>
