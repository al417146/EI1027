<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis profesionales contratados</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/OVIUser/OVIIndex}" class="nav-link">Inicio</a>
    <a th:href="@{/OVIUser/available}" class="nav-link">Solicitar profesional</a>
    <a th:href="@{/OVIUser/requestAssistance}" class="nav-link">Solicitar asistencia</a>
    <a th:href="@{/OVIUser/estadoSolicitud}" class="nav-link">Mis solicitudes</a>
    <a th:href="@{/OVIUser/list}" class="nav-link">Mis PAP/PATIS</a>
    <a th:href="@{/OVIUser/misContratos}" class="nav-link">Mis contratos</a>
    <a th:href="@{/OVIUser/profile}" class="nav-link">Editar mi perfil</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<div class="container">
  <div class="header-primary">
    <h1>Profesionales con contrato activo</h1>
  </div>
  <div style="padding:20px">
    <div th:if="${#lists.isEmpty(patis)}" class="alert-info">
      No tienes profesionales contratados.
    </div>
    <div th:unless="${#lists.isEmpty(patis)}">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${patis}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.phone}"></td>
            <td th:text="${p.mail}"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div style="margin-top:20px">
      <a th:href="@{/OVIUser/OVIIndex}" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>
</body>
</html>
