<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Actualizar OVIUser</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css" th:ref="@{css/style.css}">
</head>
<body>

<form th:action="@{/OVIUser/update}" th:object="${oviuser}" method="post">

  <!-- DNI: clave primaria, no editable -->
  <input type="text" th:field="*{DNI}" placeholder="DNI" readonly/>
  <p th:if="${#fields.hasErrors('DNI')}" th:errors="*{DNI}"></p>

  <input type="text" th:field="*{name}" placeholder="Nombre"/>
  <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

  <input type="date" th:field="*{birthDate}" placeholder="Fecha de nacimiento"/>
  <p th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></p>

  <input type="text" th:field="*{mail}" placeholder="Email"/>
  <p th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}"></p>

  <input type="text" th:field="*{phone}" placeholder="Teléfono"/>
  <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>

  <input type="text" th:field="*{gender}" placeholder="Género"/>
  <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>

  <input type="text" th:field="*{address}" placeholder="Dirección"/>
  <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>

  <input type="text" th:field="*{status}" placeholder="Status"/>
  <p th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>

  <button type="submit">Actualizar</button>

</form>

</body>
</html>
