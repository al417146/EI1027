<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis solicitudes</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}" alt="Logo OVI" class="logo-img">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/OVIUser/OVIIndex}" class="nav-link">Inicio</a>
    <a th:href="@{/OVIUser/available}" class="nav-link">Solicitar profesional</a>
    <a th:href="@{/OVIUser/estadoSolicitud}" class="nav-link">Mis solicitudes</a>
    <a th:href="@{/OVIUser/list}" class="nav-link">Mis contratos</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<div class="container">
  <div class="header-secondary">
    <h1>Estado de mis solicitudes</h1>
  </div>
  <div style="padding:20px">
    <div th:if="${#lists.isEmpty(solicitudes)}" class="alert-info">
      No has realizado ninguna solicitud.
    </div>
    <div th:unless="${#lists.isEmpty(solicitudes)}">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Profesional asignado</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="s : ${solicitudes}">
            <td th:text="${s.idRequest}"></td>
            <td th:text="${s.date != null} ? ${#dates.format(s.date, 'dd/MM/yyyy')} : '-'"></td>
            <td>
              <span th:class="${s.status == 'Aceptada'} ? 'estado-aprobada' : (${s.status == 'Denegada'} ? 'estado-rechazada' : 'estado-pendiente')"
                    th:text="${s.status}"></span>
            </td>
            <td th:text="${s.DNICand != null} ? ${s.DNICand} : 'Sin asignar'"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div style="margin-top:20px">
      <a th:href="@{/OVIUser/OVIIndex}" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>
</body>
</html>
