<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <title>Finalizar contrato</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
<body>
<header class="top-bar">
  <div class="logo">
    <img th:src="@{/images/logo-ovi.png}"
         alt="Logo OVI"
         class="logo-img" src="/static/images/logo-ovi.png">
  </div>
  <nav class="nav-bar">
    <a th:href="@{/OVIUser/OVIIndex}" class="nav-link">Inicio</a>
    <a th:href="@{/OVIUser/available}" class="nav-link">Solicitar profesional</a>
    <a th:href="@{/OVIUser/requestAssistance}" class="nav-link">Solicitar asistencia</a>
    <a th:href="@{/OVIUser/estadoSolicitud}" class="nav-link">Mis solicitudes</a>
    <a th:href="@{/OVIUser/list}" class="nav-link">Mis PAP/PATIS</a>
    <a th:href="@{/OVIUser/misContratos}" class="nav-link">Mis contratos</a>
    <a th:href="@{/OVIUser/profile}" class="nav-link">Editar mi perfil</a>
    <a th:href="@{/logoutConfirm}" class="nav-link">Cerrar sesión</a>
  </nav>
</header>
<div class="container">
  <div class="header-secondary">
    <h1>Finalizar contrato</h1>
  </div>
  <div class="card" style="margin:20px">
    <p><strong>Contrato ID:</strong> <span th:text="${contract.idContract}"></span></p>
    <p><strong>Profesional (DNI):</strong> <span th:text="${contract.DNICand}"></span></p>
    <p><strong>Fecha inicio:</strong> <span th:text="${#dates.format(contract.dateStart, 'dd/MM/yyyy')}"></span></p>
    <form th:action="@{/OVIUser/contrato/finalizar}" method="post">
      <input type="hidden" name="idContract" th:value="${contract.idContract}">
      <div class="form-group">
        <label for="dateEnd">Fecha de finalización (dd-MM-yyyy):</label>
        <input type="text" id="dateEnd" name="dateEnd" class="form-control" placeholder="dd-MM-yyyy" required>
      </div>
      <button type="submit" class="btn btn-warning">Registrar finalización</button>
      <a th:href="@{/OVIUser/misContratos}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
</body>
</html>
