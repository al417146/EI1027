<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous"/>

    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>

<body>
<main class="container mt-5">

    <h2 class="mb-4">Iniciar sesión</h2>

    <form th:action="@{/login}" th:object="${user}" method="post">

        <!-- MAIL -->
        <div class="row mb-3">
            <label for="mail" class="col-sm-2 col-form-label">Correo:</label>
            <div class="col-sm-4">
                <input id="mail" class="form-control" type="text" th:field="*{mail}"/>
            </div>
            <div class="col-sm-4 text-danger">
                <div th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}"></div>
            </div>
        </div>

        <!-- PASSWORD -->
        <div class="row mb-3">
            <label for="password" class="col-sm-2 col-form-label">Contraseña:</label>
            <div class="col-sm-4">
                <input id="password" class="form-control" type="password" th:field="*{password}"/>
            </div>
            <div class="col-sm-4 text-danger">
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
        </div>

        <!-- BOTÓN -->
        <div class="row">
            <div class="col-sm-4 offset-sm-2">
                <button type="submit" class="btn btn-primary">Acceder</button>
            </div>
        </div>

    </form>

</main>
</body>
</html>
